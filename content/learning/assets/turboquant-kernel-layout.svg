<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">TurboQuant CUDA kernel memory layout</title>
  <desc id="desc">A diagram showing one CUDA block processing one vector, channels distributed across threads, and output written to packed quantized cache.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d3d46"/>
    </marker>
  </defs>
  <rect width="1000" height="500" rx="18" fill="#fbfbfc"/>
  <rect x="28" y="28" width="944" height="444" rx="14" fill="#fff" stroke="#d9d9e3"/>
  <g font-family="Arial, sans-serif" fill="#171717">
    <text x="500" y="68" text-anchor="middle" font-size="26" font-weight="700">Kernel 视角：一个 block 处理一个 KV 向量</text>
    <text x="500" y="96" text-anchor="middle" font-size="15" fill="#555">把 [layer, head, token, channel] 里的一个向量压成 bit-packed idx</text>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="70" y="150" width="230" height="210" rx="12" fill="#eef6ff" stroke="#8fb9e8"/>
    <text x="185" y="184" text-anchor="middle" font-size="20" font-weight="700" fill="#15314f">输入 KV 向量</text>
    <text x="185" y="215" text-anchor="middle" font-size="15" fill="#345">float16 / bfloat16</text>
    <g transform="translate(95 245)">
      <rect x="0" y="0" width="180" height="28" fill="#d8ebff" stroke="#8fb9e8"/>
      <rect x="0" y="28" width="180" height="28" fill="#eaf5ff" stroke="#8fb9e8"/>
      <rect x="0" y="56" width="180" height="28" fill="#d8ebff" stroke="#8fb9e8"/>
      <rect x="0" y="84" width="180" height="28" fill="#eaf5ff" stroke="#8fb9e8"/>
      <text x="90" y="19" text-anchor="middle" font-size="13" fill="#345">channel 0..31</text>
      <text x="90" y="47" text-anchor="middle" font-size="13" fill="#345">channel 32..63</text>
      <text x="90" y="75" text-anchor="middle" font-size="13" fill="#345">channel 64..95</text>
      <text x="90" y="103" text-anchor="middle" font-size="13" fill="#345">channel 96..127</text>
    </g>

    <rect x="390" y="132" width="220" height="246" rx="12" fill="#f7f7f7" stroke="#bfc3cc"/>
    <text x="500" y="166" text-anchor="middle" font-size="20" font-weight="700" fill="#222">CUDA block</text>
    <text x="500" y="194" text-anchor="middle" font-size="15" fill="#555">blockIdx = 向量编号</text>
    <g transform="translate(420 224)">
      <rect x="0" y="0" width="160" height="32" rx="6" fill="#e9e9ef" stroke="#bfc3cc"/>
      <text x="80" y="21" text-anchor="middle" font-size="13" fill="#333">thread 0: ch 0, 128...</text>
      <rect x="0" y="42" width="160" height="32" rx="6" fill="#f2f2f6" stroke="#bfc3cc"/>
      <text x="80" y="63" text-anchor="middle" font-size="13" fill="#333">thread 1: ch 1, 129...</text>
      <rect x="0" y="84" width="160" height="32" rx="6" fill="#e9e9ef" stroke="#bfc3cc"/>
      <text x="80" y="105" text-anchor="middle" font-size="13" fill="#333">...</text>
      <rect x="0" y="126" width="160" height="32" rx="6" fill="#f2f2f6" stroke="#bfc3cc"/>
      <text x="80" y="147" text-anchor="middle" font-size="13" fill="#333">thread 127: ch 127...</text>
    </g>

    <rect x="700" y="150" width="230" height="210" rx="12" fill="#eff9f0" stroke="#80b88b"/>
    <text x="815" y="184" text-anchor="middle" font-size="20" font-weight="700" fill="#193a22">压缩输出</text>
    <text x="815" y="215" text-anchor="middle" font-size="15" fill="#365c3c">idx + norm + QJL sign</text>
    <g transform="translate(725 245)">
      <rect x="0" y="0" width="180" height="28" fill="#dff4e2" stroke="#80b88b"/>
      <rect x="0" y="28" width="180" height="28" fill="#f0faf1" stroke="#80b88b"/>
      <rect x="0" y="56" width="180" height="28" fill="#dff4e2" stroke="#80b88b"/>
      <rect x="0" y="84" width="180" height="28" fill="#f0faf1" stroke="#80b88b"/>
      <text x="90" y="19" text-anchor="middle" font-size="13" fill="#365c3c">packed idx words</text>
      <text x="90" y="47" text-anchor="middle" font-size="13" fill="#365c3c">residual norm γ</text>
      <text x="90" y="75" text-anchor="middle" font-size="13" fill="#365c3c">packed QJL signs</text>
      <text x="90" y="103" text-anchor="middle" font-size="13" fill="#365c3c">optional scale / metadata</text>
    </g>
  </g>

  <g stroke="#3d3d46" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M300 255 H380"/>
    <path d="M610 255 H690"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#555">
    <text x="500" y="424" text-anchor="middle">重点：kernel 不应该“先解压成大矩阵再算”，最好边读 packed cache 边解码、边做点积。</text>
  </g>
</svg>
