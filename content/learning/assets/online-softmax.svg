<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" role="img" aria-labelledby="ti de">
<title id="ti">online softmax 的分块合并</title>
<desc id="de">一行的 softmax 按块计算：新块的分数重缩放到运行最大值，再合并进累计状态。合并公式用真正的上下标排版：m′ = max(m, 块最大)，ℓ′ = e^(m−m′)·ℓ + 块指数和，Õ′ = e^(m−m′)·Õ + e^(S−m′)·V。</desc>
<rect width="920" height="480" rx="22" fill="#f8fafc"/>
<text x="460.0" y="42" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#111827" text-anchor="middle" font-weight="700">online softmax：一块一块合并</text>
<text x="460.0" y="70" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#64748b" text-anchor="middle" font-weight="400">标准实现要等整行算完才知道 max；在线版只维护 m、ℓ、Õ，随块更新</text>
<rect x="70" y="108" width="110" height="60" rx="12" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/>
<text x="125.0" y="145" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3730a3" text-anchor="middle" font-weight="700">S 块1</text>
<rect x="196" y="108" width="110" height="60" rx="12" fill="#e0e7ff" stroke="#818cf8" stroke-width="2"/>
<text x="251.0" y="145" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3730a3" text-anchor="middle" font-weight="700">S 块2</text>
<rect x="322" y="108" width="110" height="60" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
<text x="377.0" y="145" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3730a3" text-anchor="middle" font-weight="600">S 块3</text>
<circle cx="432" cy="138" r="5" fill="#94a3b8"/>
<circle cx="452" cy="138" r="5" fill="#94a3b8"/>
<circle cx="472" cy="138" r="5" fill="#94a3b8"/>
<rect x="570" y="108" width="110" height="60" rx="12" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/>
<text x="625" y="145" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3730a3" font-weight="700" text-anchor="middle" ><tspan dy="0.0" font-size="15">S</tspan><tspan dy="4.0" font-size="10.5">j</tspan><tspan dy="-4.0" font-size="15"> 块</tspan></text>
<text x="460.0" y="203" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle" font-weight="400">每个块的分数逐行扫，一次只处理一个块</text>
<rect x="70" y="232" width="348" height="146" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="92" y="264" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111827" text-anchor="start" font-weight="700">运行中的状态</text>
<text x="92" y="296" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155" font-weight="400" text-anchor="start" ><tspan dy="0.0" font-size="15">m</tspan><tspan dy="0.0" font-size="15"> = 行最大值（已扫的块里）</tspan></text>
<text x="92" y="324" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155" font-weight="400" text-anchor="start" ><tspan dy="0.0" font-size="15">ℓ</tspan><tspan dy="0.0" font-size="15"> = 指数和（已归一化到当前 m）</tspan></text>
<text x="92" y="352" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155" font-weight="400" text-anchor="start" ><tspan dy="0.0" font-size="15">Õ</tspan><tspan dy="0.0" font-size="15"> = 未归一化的输出累计</tspan></text>
<rect x="452" y="232" width="398" height="146" rx="14" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
<text x="472" y="262" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#854d0e" text-anchor="start" font-weight="700">合并一个块（′ = 更新后的值）</text>
<text x="472" y="292" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#713f12" font-weight="400" text-anchor="start" ><tspan dy="0.0" font-size="15">m′ = max(m, 块最大)</tspan></text>
<text x="472" y="320" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#713f12" font-weight="400" text-anchor="start" ><tspan dy="0.0" font-size="15">ℓ</tspan><tspan dy="0.0" font-size="15">′ = e</tspan><tspan dy="-7.0" font-size="10.5">m−m′</tspan><tspan dy="7.0" font-size="15">·ℓ + 块指数和</tspan></text>
<text x="472" y="352" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#713f12" font-weight="400" text-anchor="start" ><tspan dy="0.0" font-size="15">Õ</tspan><tspan dy="0.0" font-size="15">′ = e</tspan><tspan dy="-7.0" font-size="10.5">m−m′</tspan><tspan dy="7.0" font-size="15">·Õ + e</tspan><tspan dy="-7.0" font-size="10.5">S−m′</tspan><tspan dy="7.0" font-size="15">·V</tspan></text>
<line x1="244" y1="182" x2="244" y2="226" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="680" y1="182" x2="651" y2="226" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70" y="396" width="780" height="52" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="460.0" y="430" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111827" font-weight="700" text-anchor="middle" ><tspan dy="0.0" font-size="15">扫完所有块：O = Õ / ℓ，</tspan><tspan dy="0.0" font-size="15">L = m + log ℓ</tspan><tspan dy="0.0" font-size="15">（与 m 取多少无关）</tspan></text>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L8 6 L2 10 Z" fill="#475569"/></marker></defs>
</svg>
