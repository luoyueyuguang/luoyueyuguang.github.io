<svg xmlns="http://www.w3.org/2000/svg" width="930" height="430" viewBox="0 0 930 430" role="img" aria-labelledby="title desc">
  <title id="title">MSA two branches</title>
  <desc id="desc">MSA has an index branch that scores and selects blocks, and a main branch that performs attention on selected blocks.</desc>
  <defs>
    <linearGradient id="idx" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="main" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="930" height="430" rx="22" fill="#f8fafc"/>
  <text x="465" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">MSA 的两个分支：索引分支负责找，主分支负责读</text>

  <g transform="translate(55 155)">
    <rect x="0" y="0" width="120" height="72" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="60" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">Hidden</text>
    <text x="60" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">X</text>
  </g>

  <line x1="177" y1="180" x2="255" y2="130" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="177" y1="205" x2="255" y2="290" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(260 82)">
    <rect x="0" y="0" width="240" height="126" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="36" rx="16" fill="url(#idx)"/>
    <text x="120" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Index Branch</text>
    <text x="28" y="65" font-family="Arial, sans-serif" font-size="14" fill="#334155">Q_idx = X W_q_idx</text>
    <text x="28" y="91" font-family="Arial, sans-serif" font-size="14" fill="#334155">K_idx = X W_k_idx</text>
    <text x="28" y="116" font-family="Arial, sans-serif" font-size="14" fill="#64748b">轻量打分 + Top-K</text>
  </g>

  <g transform="translate(260 250)">
    <rect x="0" y="0" width="240" height="126" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="36" rx="16" fill="url(#main)"/>
    <text x="120" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Main Branch</text>
    <text x="28" y="65" font-family="Arial, sans-serif" font-size="14" fill="#334155">Q, K, V = standard GQA</text>
    <text x="28" y="91" font-family="Arial, sans-serif" font-size="14" fill="#334155">只读取 selected blocks</text>
    <text x="28" y="116" font-family="Arial, sans-serif" font-size="14" fill="#64748b">标准 softmax attention</text>
  </g>

  <g transform="translate(610 112)">
    <rect x="0" y="0" width="250" height="236" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="125" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">数据流</text>
    <text x="30" y="75" font-family="Arial, sans-serif" font-size="14" fill="#334155">1. Index Branch 选出 block ids</text>
    <rect x="30" y="92" width="190" height="32" rx="8" fill="#ede9fe"/>
    <text x="125" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#5b21b6">[1, 5, 19, ..., local]</text>
    <text x="30" y="155" font-family="Arial, sans-serif" font-size="14" fill="#334155">2. Main Branch 读取这些 blocks</text>
    <text x="30" y="185" font-family="Arial, sans-serif" font-size="14" fill="#334155">3. 输出该层 attention 结果</text>
    <rect x="30" y="200" width="190" height="30" rx="8" fill="#dcfce7"/>
    <text x="125" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#166534">O_i</text>
  </g>

  <line x1="502" y1="145" x2="602" y2="205" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="502" y1="310" x2="602" y2="252" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="465" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">关键点：Index Branch 只决定“读哪些块”；Main Branch 仍然在这些块上做正常 softmax attention。</text>
</svg>
