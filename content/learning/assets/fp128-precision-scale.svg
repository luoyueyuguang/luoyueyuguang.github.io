<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" role="img" aria-labelledby="title desc">
  <title id="title">各格式单位舍入的数量级对比</title>
  <desc id="desc">对数轴上展示 fp16 到 fp128 的单位舍入 u 的位置，fp128 比 fp64 低约 19 个数量级。</desc>
  <defs>
    <style>
      .title{font:700 22px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}
      .sub{font:15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#475569}
      .tick{font:13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#64748b}
      .fmt{font:700 16px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}
      .val{font:14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#334155}
      .note{font:600 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#475569}
      .axis{stroke:#94a3b8;stroke-width:2}
      .grid{stroke:#e2e8f0;stroke-width:1;stroke-dasharray:4 4}
      .dot16{fill:#f59e0b}
      .dot32{fill:#0284c7}
      .dot64{fill:#16a34a}
      .dot128{fill:#7c3aed}
    </style>
  </defs>
  <rect width="980" height="400" fill="#ffffff"/>
  <text x="40" y="44" class="title">单位舍入 u 的数量级：fp128 到底比 double 低多少</text>
  <text x="40" y="72" class="sub">对数轴（每格 10 倍）。u = 2^(尾数位数+1) 是单次浮点运算的相对误差下限</text>

  <!-- 轴：值越小越靠右。轴域 10^0 到 10^-36，x 从 120 到 940 -->
  <!-- x(v) = 120 + (log10 v / -36) * 820 -->
  <line x1="120" y1="330" x2="940" y2="330" class="axis"/>
  <!-- 刻度：10^0, 10^-8, 10^-16, 10^-24, 10^-32 -->
  <!-- 10^0: x=120; 10^-8: x=302; 10^-16: x=484; 10^-24: x=667; 10^-32: x=849 -->
  <line x1="120" y1="325" x2="120" y2="335" class="axis"/>
  <text x="104" y="352" class="tick">10⁰</text>
  <line x1="302" y1="325" x2="302" y2="335" class="axis"/>
  <text x="286" y="352" class="tick">10⁻⁸</text>
  <line x1="484" y1="325" x2="484" y2="335" class="axis"/>
  <text x="466" y="352" class="tick">10⁻¹⁶</text>
  <line x1="667" y1="325" x2="667" y2="335" class="axis"/>
  <text x="649" y="352" class="tick">10⁻²⁴</text>
  <line x1="849" y1="325" x2="849" y2="335" class="axis"/>
  <text x="831" y="352" class="tick">10⁻³²</text>

  <!-- fp16: u=2^-11 ≈ 4.9e-4, log10=-3.31, x=120+(3.31/36)*820=195 -->
  <line x1="195" y1="330" x2="195" y2="120" class="grid"/>
  <circle cx="195" cy="120" r="8" class="dot16"/>
  <text x="120" y="105" class="fmt">fp16</text>
  <text x="120" y="126" class="val">u ≈ 4.9×10⁻⁴</text>
  <text x="120" y="146" class="note">约 3 位十进制</text>

  <!-- fp32: u=2^-24 ≈ 6.0e-8, log10=-7.22, x=120+(7.22/36)*820=285 -->
  <line x1="285" y1="330" x2="285" y2="165" class="grid"/>
  <circle cx="285" cy="165" r="8" class="dot32"/>
  <text x="210" y="190" class="fmt">fp32</text>
  <text x="210" y="211" class="val">u ≈ 6.0×10⁻⁸</text>
  <text x="210" y="231" class="note">约 7 位十进制</text>

  <!-- fp64: u=2^-53 ≈ 1.1e-16, log10=-15.95, x=120+(15.95/36)*820=483 -->
  <line x1="483" y1="330" x2="483" y2="215" class="grid"/>
  <circle cx="483" cy="215" r="8" class="dot64"/>
  <text x="402" y="240" class="fmt">fp64</text>
  <text x="402" y="261" class="val">u ≈ 1.1×10⁻¹⁶</text>
  <text x="402" y="281" class="note">约 16 位十进制</text>

  <!-- fp128: u=2^-113 ≈ 9.6e-35, log10=-34.02, x=120+(34.02/36)*820=895 -->
  <line x1="895" y1="330" x2="895" y2="120" class="grid"/>
  <circle cx="895" cy="120" r="8" class="dot128"/>
  <text x="740" y="105" class="fmt">fp128</text>
  <text x="740" y="126" class="val">u ≈ 9.6×10⁻³⁵</text>
  <text x="740" y="146" class="note">约 34 位十进制</text>

  <text x="120" y="385" class="note">fp128 比 fp64 低约 19 个数量级：double 误差的 10⁻¹⁹ 才是它的起点</text>
</svg>
