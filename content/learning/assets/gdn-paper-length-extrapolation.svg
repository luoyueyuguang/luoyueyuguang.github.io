<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680" role="img" aria-labelledby="title desc">
  <title id="title">GDN paper length extrapolation figure redrawn</title>
  <desc id="desc">A redrawn six-panel summary of length extrapolation perplexity trends from Figure 2 of the Gated DeltaNet paper.</desc>
