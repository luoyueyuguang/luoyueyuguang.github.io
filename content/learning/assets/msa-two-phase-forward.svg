<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">MSA two phase forward</title>
  <desc id="desc">KV outer attention writes partial outputs and log-sum-exp values into buffers, then a combine kernel merges them with global softmax weights.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="22" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Two-phase Forward：先算 partial，再用 LSE 正确合并</text>
  <text x="480" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#64748b">KV-outer 会把一个 query 的多个 selected blocks 分给不同 CTAs，不能直接把局部 softmax 输出相加</text>

  <g transform="translate(54 120)">
    <rect x="0" y="0" width="210" height="250" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="105" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">selected KV blocks</text>
    <rect x="36" y="58" width="138" height="36" rx="9" fill="#dcfce7" stroke="#22c55e"/>
    <rect x="36" y="108" width="138" height="36" rx="9" fill="#dcfce7" stroke="#22c55e"/>
    <rect x="36" y="158" width="138" height="36" rx="9" fill="#dcfce7" stroke="#22c55e"/>
    <text x="105" y="81" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#166534">block s=0</text>
    <text x="105" y="131" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#166534">block s=1</text>
    <text x="105" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#166534">block s=2 ...</text>
    <text x="105" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">每个 block 单独产生</text>
    <text x="105" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">局部 softmax 结果</text>
  </g>

  <line x1="278" y1="245" x2="356" y2="245" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(370 120)">
    <rect x="0" y="0" width="260" height="250" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="130" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#047857">Phase 1: attention kernel</text>
    <rect x="28" y="62" width="204" height="46" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="130" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1d4ed8">QK MMA + local softmax</text>
    <rect x="28" y="126" width="204" height="46" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="130" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1d4ed8">PV MMA 得到 partial O</text>
    <rect x="28" y="190" width="204" height="38" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="130" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#92400e">写 O_buf 和 LSE_buf</text>
  </g>

  <line x1="645" y1="245" x2="718" y2="245" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(730 120)">
    <rect x="0" y="0" width="180" height="250" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="90" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">buffers</text>
    <rect x="28" y="58" width="124" height="44" rx="9" fill="#fee2e2" stroke="#ef4444"/>
    <rect x="28" y="116" width="124" height="44" rx="9" fill="#fee2e2" stroke="#ef4444"/>
    <text x="90" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#991b1b">O_buf[k,n,Hq,d]</text>
    <text x="90" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#991b1b">LSE_buf[k,n,Hq]</text>
    <text x="90" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">slot 由 scheduler</text>
    <text x="90" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">预分配，避免 atomic</text>
  </g>

  <path d="M820 382 C820 420 615 425 560 386" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(220 386)">
    <rect x="0" y="0" width="500" height="56" rx="14" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="250" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#5b21b6">Phase 2: combine kernel</text>
    <text x="250" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5b21b6">LSE = logsumexp(LSE_s)，w_s = exp(LSE_s - LSE)，O = sum_s w_s O_s</text>
  </g>
</svg>
