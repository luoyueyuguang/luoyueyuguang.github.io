<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">
  <title id="title">FlashAttention forward tiling loop</title>
  <desc id="desc">One thread block owns one query row block Q_i. In an outer loop over key/value blocks it loads K_j and V_j from HBM into SRAM, computes S_ij = Q_i K_j^T on the tensor cores, rescales with the online softmax max m_i, converts P to fp16/bf16 and accumulates P_ij V_j into the output accumulator. Only O and the softmax statistics go back to HBM; S and P never touch HBM.</desc>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="500" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2937"><tspan font-size="17">一个 thread block 的循环：固定 Q</tspan><tspan dy="4" font-size="10.5">i</tspan><tspan dy="-4" font-size="17">，遍历 K</tspan><tspan dy="4" font-size="10.5">j</tspan><tspan dy="-4" font-size="17"> / V</tspan><tspan dy="4" font-size="10.5">j</tspan><tspan dy="-4" font-size="10.5"/></text>

  <!-- HBM: Q column -->
  <text x="95" y="70" text-anchor="middle" font-size="13" fill="#6b7280">Q（HBM）</text>
  <rect x="45" y="80" width="100" height="270" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="45" y="170" width="100" height="90" fill="#3b82f6" opacity="0.85"/>
  <text x="95" y="222" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="600"><tspan font-size="15">Q</tspan><tspan dy="4" font-size="10.5">i</tspan><tspan dy="-4" font-size="10.5"/></text>
  <text x="95" y="330" text-anchor="middle" font-size="12" fill="#2563eb"><tspan font-size="12">B</tspan><tspan dy="4" font-size="10.5">r</tspan><tspan dy="-4" font-size="12"> × d</tspan></text>

  <!-- HBM: K/V column -->
  <text x="237" y="70" text-anchor="middle" font-size="13" fill="#6b7280">K、V（HBM）</text>
  <rect x="177" y="80" width="120" height="270" fill="#fef2f2" stroke="#fca5a5"/>
  <rect x="177" y="80" width="120" height="54" fill="#ef4444" opacity="0.85"/>
  <text x="237" y="114" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600"><tspan font-size="14">K</tspan><tspan dy="4" font-size="10.5">j</tspan><tspan dy="-4" font-size="14"> / V</tspan><tspan dy="4" font-size="10.5">j</tspan><tspan dy="-4" font-size="10.5"/></text>
  <text x="237" y="158" text-anchor="middle" font-size="12" fill="#b91c1c"><tspan font-size="12">B</tspan><tspan dy="4" font-size="10.5">c</tspan><tspan dy="-4" font-size="12"> × d</tspan></text>
  <text x="237" y="180" text-anchor="middle" font-size="12" fill="#b91c1c">↓ 逐块</text>
  <rect x="177" y="196" width="120" height="40" fill="#fee2e2" stroke="#fca5a5" stroke-dasharray="4 3"/>
  <text x="237" y="222" text-anchor="middle" font-size="12" fill="#9ca3af">…</text>
  <rect x="177" y="256" width="120" height="40" fill="#fee2e2" stroke="#fca5a5" stroke-dasharray="4 3"/>
  <text x="237" y="282" text-anchor="middle" font-size="12" fill="#9ca3af">…</text>
  <rect x="177" y="316" width="120" height="34" fill="#fee2e2" stroke="#fca5a5" stroke-dasharray="4 3"/>

  <!-- SRAM panel -->
  <rect x="330" y="60" width="250" height="330" fill="#f9fafb" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="455" y="82" text-anchor="middle" font-size="13" fill="#4b5563">片上 SRAM（A100 每 SM ≈ 164 KB）</text>
  <rect x="345" y="95" width="90" height="70" fill="#bfdbfe" stroke="#3b82f6"/>
  <text x="390" y="127" text-anchor="middle" font-size="13" fill="#1e3a8a" font-weight="600"><tspan font-size="13">Q</tspan><tspan dy="4" font-size="10.5">i</tspan><tspan dy="-4" font-size="10.5"/></text>
  <text x="390" y="145" text-anchor="middle" font-size="11" fill="#1e40af"><tspan font-size="11">B</tspan><tspan dy="4" font-size="10.5">r</tspan><tspan dy="-4" font-size="11"> × d</tspan></text>
  <rect x="450" y="95" width="115" height="70" fill="#fecaca" stroke="#ef4444"/>
  <text x="507" y="127" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="600"><tspan font-size="13">K</tspan><tspan dy="4" font-size="10.5">j</tspan><tspan dy="-4" font-size="10.5"/></text>
  <text x="507" y="145" text-anchor="middle" font-size="11" fill="#991b1b"><tspan font-size="11">B</tspan><tspan dy="4" font-size="10.5">c</tspan><tspan dy="-4" font-size="11"> × d</tspan></text>
  <rect x="345" y="180" width="220" height="60" fill="#fde68a" stroke="#d97706"/>
  <text x="455" y="205" text-anchor="middle" font-size="13" fill="#78350f" font-weight="600"><tspan font-size="13">S</tspan><tspan dy="4" font-size="10.5">ij</tspan><tspan dy="-4" font-size="13"> = Q</tspan><tspan dy="4" font-size="10.5">i</tspan><tspan dy="-4" font-size="13"> · K</tspan><tspan dy="4" font-size="10.5">j</tspan><tspan dy="-11" font-size="10.5">T</tspan><tspan dy="7" font-size="10.5"/></text>
  <text x="455" y="226" text-anchor="middle" font-size="11" fill="#92400e"><tspan font-size="11">B</tspan><tspan dy="4" font-size="10.5">r</tspan><tspan dy="-4" font-size="11"> × B</tspan><tspan dy="4" font-size="10.5">c</tspan><tspan dy="-4" font-size="11">　（fp32 累加器）</tspan></text>
  <rect x="345" y="255" width="220" height="60" fill="#fed7aa" stroke="#ea580c"/>
  <text x="455" y="280" text-anchor="middle" font-size="13" fill="#7c2d12" font-weight="600"><tspan font-size="13">P̃</tspan><tspan dy="4" font-size="10.5">ij</tspan><tspan dy="-4" font-size="13"> = exp(S</tspan><tspan dy="4" font-size="10.5">ij</tspan><tspan dy="-4" font-size="13"> − m</tspan><tspan dy="4" font-size="10.5">i</tspan><tspan dy="-4" font-size="13">)</tspan></text>
  <text x="455" y="301" text-anchor="middle" font-size="11" fill="#9a3412"><tspan font-size="11">B</tspan><tspan dy="4" font-size="10.5">r</tspan><tspan dy="-4" font-size="11"> × B</tspan><tspan dy="4" font-size="10.5">c</tspan><tspan dy="-4" font-size="11">（转 fp16/bf16 喂 tensor core）</tspan></text>
  <rect x="345" y="330" width="100" height="50" fill="#fecaca" stroke="#ef4444"/>
  <text x="395" y="360" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="600"><tspan font-size="13">V</tspan><tspan dy="4" font-size="10.5">j</tspan><tspan dy="-4" font-size="10.5"/></text>
  <rect x="465" y="330" width="100" height="50" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="515" y="351" text-anchor="middle" font-size="13" fill="#14532d" font-weight="600"><tspan font-size="13">Õ</tspan><tspan dy="4" font-size="10.5">i</tspan><tspan dy="-4" font-size="10.5"/></text>
  <text x="515" y="369" text-anchor="middle" font-size="11" fill="#166534"><tspan font-size="11">B</tspan><tspan dy="4" font-size="10.5">r</tspan><tspan dy="-4" font-size="11"> × d</tspan></text>

  <!-- HBM accumulation -->
  <rect x="720" y="240" width="235" height="230" fill="#f0fdf4" stroke="#86efac"/>
  <text x="837" y="266" text-anchor="middle" font-size="13" fill="#166534">HBM 累积状态</text>
  <rect x="740" y="280" width="195" height="42" fill="#dcfce7" stroke="#16a34a"/>
  <text x="837" y="307" text-anchor="middle" font-size="13" fill="#14532d"><tspan font-size="13">O</tspan><tspan dy="4" font-size="10.5">i</tspan><tspan dy="-4" font-size="13">（B</tspan><tspan dy="4" font-size="10.5">r</tspan><tspan dy="-4" font-size="13"> × d，fp32）</tspan></text>
  <rect x="740" y="332" width="195" height="42" fill="#dcfce7" stroke="#16a34a"/>
  <text x="837" y="359" text-anchor="middle" font-size="13" fill="#14532d"><tspan font-size="13">m</tspan><tspan dy="4" font-size="10.5">i</tspan><tspan dy="-4" font-size="13">、ℓ</tspan><tspan dy="4" font-size="10.5">i</tspan><tspan dy="-4" font-size="13">（每行标量）</tspan></text>
  <rect x="740" y="384" width="195" height="42" fill="#dcfce7" stroke="#16a34a"/>
  <text x="837" y="405" text-anchor="middle" font-size="12" fill="#14532d"><tspan font-size="12">整块跑完 → L</tspan><tspan dy="4" font-size="10.5">i</tspan><tspan dy="-4" font-size="12"> = m</tspan><tspan dy="4" font-size="10.5">i</tspan><tspan dy="-4" font-size="12"> + log ℓ</tspan><tspan dy="4" font-size="10.5">i</tspan><tspan dy="-4" font-size="10.5"/></text>
  <text x="837" y="442" text-anchor="middle" font-size="11" fill="#15803d">只有 O/L 回写，S、P 从不落 HBM</text>

  <!-- arrows HBM -> SRAM -->
  <line x1="145" y1="215" x2="326" y2="215" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="297" y1="107" x2="326" y2="107" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>

  <!-- accumulate arrow -->
  <line x1="580" y1="355" x2="716" y2="355" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="648" y="345" text-anchor="middle" font-size="12" fill="#166534"><tspan font-size="12">O</tspan><tspan dy="4" font-size="10.5">i</tspan><tspan dy="-4" font-size="12"> ← scale·Õ</tspan><tspan dy="4" font-size="10.5">i</tspan><tspan dy="-4" font-size="12"> + P̃</tspan><tspan dy="4" font-size="10.5">ij</tspan><tspan dy="-4" font-size="12">·V</tspan><tspan dy="4" font-size="10.5">j</tspan><tspan dy="-4" font-size="10.5"/></text>

  <text x="500" y="410" text-anchor="middle" font-size="13" fill="#4b5563"><tspan font-size="13">外层循环 j（从 n_block_max−1 倒着走）：每轮只搬一块 K</tspan><tspan dy="4" font-size="10.5">j</tspan><tspan dy="-4" font-size="13">、V</tspan><tspan dy="4" font-size="10.5">j</tspan><tspan dy="-4" font-size="13"> 进 SRAM</tspan></text>
  <text x="500" y="436" text-anchor="middle" font-size="13" fill="#4b5563"><tspan font-size="13">Q</tspan><tspan dy="4" font-size="10.5">i</tspan><tspan dy="-4" font-size="13"> 只在 prologue 搬一次，之后一直留在寄存器 / SRAM</tspan></text>
  <text x="500" y="462" text-anchor="middle" font-size="12" fill="#6b7280"><tspan font-size="12">S</tspan><tspan dy="4" font-size="10.5">ij</tspan><tspan dy="-4" font-size="12">、P̃</tspan><tspan dy="4" font-size="10.5">ij</tspan><tspan dy="-4" font-size="12"> 每轮算完即丢：不物化到 HBM，也不需要二次读回</tspan></text>

  <defs>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
