<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">Gated DeltaNet paper architecture figure redrawn</title>
  <desc id="desc">A redrawn overview of Gated DeltaNet-H1, Gated DeltaNet-H2, and the Gated DeltaNet block design based on Figure 1 of the paper.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1180" height="520" rx="18" fill="#fbfbfc"/>
  <rect x="30" y="30" width="1120" height="460" rx="14" fill="#fff" stroke="#d9d9e3"/>
