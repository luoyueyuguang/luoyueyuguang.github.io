<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <title id="title">Quantization kernel thread mapping</title>
  <desc id="desc">A diagram showing CUDA threads loading rotated coordinates, searching a small codebook, and writing packed indices.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="1000" height="460" rx="18" fill="#fbfbfc"/>
  <rect x="28" y="28" width="944" height="404" rx="14" fill="#fff" stroke="#d9d9e3"/>
  <g font-family="Arial, sans-serif" fill="#171717">
    <text x="500" y="68" text-anchor="middle" font-size="26" font-weight="700">Quant_mse kernel：每个线程处理若干 channel</text>
    <text x="500" y="96" text-anchor="middle" font-size="15" fill="#555">codebook 很小，适合放 constant memory 或 shared memory</text>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="70" y="145" width="180" height="190" rx="12" fill="#eef6ff" stroke="#8fb9e8"/>
    <text x="160" y="178" text-anchor="middle" font-size="19" font-weight="700" fill="#15314f">rotated z</text>
    <text x="160" y="206" text-anchor="middle" font-size="14" fill="#345">z = Πx</text>
    <g transform="translate(95 230)">
      <rect x="0" y="0" width="130" height="26" fill="#d8ebff" stroke="#8fb9e8"/>
      <rect x="0" y="26" width="130" height="26" fill="#eaf5ff" stroke="#8fb9e8"/>
      <rect x="0" y="52" width="130" height="26" fill="#d8ebff" stroke="#8fb9e8"/>
      <rect x="0" y="78" width="130" height="26" fill="#eaf5ff" stroke="#8fb9e8"/>
      <text x="65" y="18" text-anchor="middle" font-size="13" fill="#345">z0</text>
      <text x="65" y="44" text-anchor="middle" font-size="13" fill="#345">z1</text>
      <text x="65" y="70" text-anchor="middle" font-size="13" fill="#345">...</text>
      <text x="65" y="96" text-anchor="middle" font-size="13" fill="#345">zd-1</text>
    </g>

    <rect x="330" y="145" width="180" height="190" rx="12" fill="#fff4e8" stroke="#e7ad70"/>
    <text x="420" y="178" text-anchor="middle" font-size="19" font-weight="700" fill="#4a2a06">nearest center</text>
    <text x="420" y="206" text-anchor="middle" font-size="14" fill="#604019">argmin |zj - ck|</text>
    <g transform="translate(360 236)">
      <rect x="0" y="0" width="120" height="34" rx="6" fill="#fffaf5" stroke="#e7ad70"/>
      <text x="60" y="22" text-anchor="middle" font-size="13" fill="#604019">c0 c1 c2 c3</text>
      <rect x="0" y="50" width="120" height="34" rx="6" fill="#fffaf5" stroke="#e7ad70"/>
      <text x="60" y="72" text-anchor="middle" font-size="13" fill="#604019">idx_j</text>
    </g>

    <rect x="590" y="145" width="180" height="190" rx="12" fill="#f2eefe" stroke="#a993df"/>
    <text x="680" y="178" text-anchor="middle" font-size="19" font-weight="700" fill="#312057">pack</text>
    <text x="680" y="206" text-anchor="middle" font-size="14" fill="#46356c">2-bit / 3-bit / 4-bit</text>
    <g transform="translate(620 236)">
      <rect x="0" y="0" width="120" height="34" rx="6" fill="#faf7ff" stroke="#a993df"/>
      <text x="60" y="22" text-anchor="middle" font-size="13" fill="#46356c">atomic or warp pack</text>
      <rect x="0" y="50" width="120" height="34" rx="6" fill="#faf7ff" stroke="#a993df"/>
      <text x="60" y="72" text-anchor="middle" font-size="13" fill="#46356c">uint32 words</text>
    </g>

    <rect x="830" y="145" width="100" height="190" rx="12" fill="#eff9f0" stroke="#80b88b"/>
    <text x="880" y="178" text-anchor="middle" font-size="19" font-weight="700" fill="#193a22">cache</text>
    <text x="880" y="206" text-anchor="middle" font-size="14" fill="#365c3c">packed</text>
    <text x="880" y="260" text-anchor="middle" font-size="28" fill="#1f6f35">0101</text>
    <text x="880" y="292" text-anchor="middle" font-size="28" fill="#1f6f35">1100</text>
  </g>

  <g stroke="#444" stroke-width="2.4" fill="none" marker-end="url(#arrow)">
    <path d="M250 240 H320"/>
    <path d="M510 240 H580"/>
    <path d="M770 240 H820"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#555">
    <text x="500" y="390" text-anchor="middle">生产实现通常会把旋转、量化、打包和 norm 统计尽量融合，减少多次读写 HBM。</text>
  </g>
</svg>
