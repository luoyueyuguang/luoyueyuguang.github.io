<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">Delta rule 的读、算残差、写回</title>
  <desc id="desc">DeltaNet 更新不是直接写 value，而是先读旧值，再把目标值和旧值的差写入状态。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:12}
      .state{fill:#dcfce7;stroke:#16a34a;stroke-width:2;rx:12}
      .read{fill:#dbeafe;stroke:#2563eb;stroke-width:2;rx:12}
      .res{fill:#fef3c7;stroke:#d97706;stroke-width:2;rx:12}
      .title{font:700 20px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}
      .text{font:15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#334155}
      .small{font:13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#475569}
      .arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="980" height="420" fill="#ffffff"/>
  <text x="40" y="45" class="title">DeltaNet 的核心：不要盲目写入，而是写入“修正量”</text>
  <text x="40" y="74" class="text">如果旧状态已经知道 key 对应什么 value，新写入就应该少一点；如果旧状态错了，就写入残差来修正。</text>

  <rect x="65" y="140" width="145" height="82" class="state"/>
  <text x="92" y="176" class="text">旧状态 S</text>
  <text x="92" y="201" class="small">记忆里的映射</text>

  <rect x="270" y="105" width="135" height="70" class="read"/>
  <text x="300" y="136" class="text">读旧答案</text>
  <text x="292" y="160" class="small">read = S k</text>

  <rect x="270" y="230" width="135" height="70" class="box"/>
  <text x="312" y="261" class="text">目标值</text>
  <text x="313" y="285" class="small">v_t</text>

  <path d="M218 175 H260" class="arrow"/>
  <path d="M338 177 V220" class="arrow"/>
  <path d="M410 265 H485" class="arrow"/>
  <path d="M410 140 H485" class="arrow"/>

  <rect x="500" y="155" width="175" height="110" class="res"/>
  <text x="540" y="194" class="text">计算残差</text>
  <text x="528" y="221" class="small">e_t = v_t - S k_t</text>
  <text x="527" y="245" class="small">只写还缺的部分</text>

  <path d="M685 210 H745" class="arrow"/>
  <rect x="760" y="155" width="155" height="110" class="state"/>
  <text x="800" y="194" class="text">更新状态</text>
  <text x="790" y="221" class="small">S_t = S + beta</text>
  <text x="788" y="245" class="small">· e_t k_t^T</text>
</svg>
