<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" role="img" aria-labelledby="title desc">
  <title id="title">MSA TopK kernel</title>
  <desc id="desc">A row of block scores is scanned by 32 warp lanes. Each lane keeps a local top-k heap, then warp shuffle merges the local results.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="940" height="430" rx="22" fill="#f8fafc"/>
  <text x="470" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">TopK Kernel：32 个 lanes 分工扫描一行 block scores</text>
  <text x="470" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#64748b">softmax 不改变大小顺序，所以直接对 raw score 做 TopK，省掉 exp 和归一化</text>

  <g transform="translate(50 112)">
    <rect x="0" y="0" width="840" height="56" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="18" y="-16" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">一行 block scores</text>
    <g>
      <rect x="20" y="16" width="28" height="24" rx="5" fill="#dbeafe"/>
      <rect x="54" y="16" width="28" height="24" rx="5" fill="#e0f2fe"/>
      <rect x="88" y="16" width="28" height="24" rx="5" fill="#dbeafe"/>
      <rect x="122" y="16" width="28" height="24" rx="5" fill="#e0f2fe"/>
      <rect x="156" y="16" width="28" height="24" rx="5" fill="#dbeafe"/>
      <rect x="190" y="16" width="28" height="24" rx="5" fill="#e0f2fe"/>
      <rect x="224" y="16" width="28" height="24" rx="5" fill="#dbeafe"/>
      <rect x="258" y="16" width="28" height="24" rx="5" fill="#e0f2fe"/>
      <rect x="292" y="16" width="28" height="24" rx="5" fill="#dbeafe"/>
      <rect x="326" y="16" width="28" height="24" rx="5" fill="#e0f2fe"/>
      <rect x="360" y="16" width="28" height="24" rx="5" fill="#dbeafe"/>
      <rect x="394" y="16" width="28" height="24" rx="5" fill="#e0f2fe"/>
      <rect x="428" y="16" width="28" height="24" rx="5" fill="#dbeafe"/>
      <rect x="462" y="16" width="28" height="24" rx="5" fill="#e0f2fe"/>
      <rect x="496" y="16" width="28" height="24" rx="5" fill="#dbeafe"/>
      <rect x="530" y="16" width="28" height="24" rx="5" fill="#e0f2fe"/>
      <rect x="564" y="16" width="28" height="24" rx="5" fill="#dbeafe"/>
      <rect x="598" y="16" width="28" height="24" rx="5" fill="#e0f2fe"/>
      <rect x="632" y="16" width="28" height="24" rx="5" fill="#dbeafe"/>
      <rect x="666" y="16" width="28" height="24" rx="5" fill="#e0f2fe"/>
      <rect x="700" y="16" width="28" height="24" rx="5" fill="#dbeafe"/>
      <rect x="734" y="16" width="28" height="24" rx="5" fill="#e0f2fe"/>
      <rect x="768" y="16" width="28" height="24" rx="5" fill="#dbeafe"/>
      <text x="810" y="34" font-family="Arial, sans-serif" font-size="16" fill="#64748b">...</text>
    </g>
  </g>

  <line x1="470" y1="184" x2="470" y2="218" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(70 220)">
    <rect x="0" y="0" width="800" height="88" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="400" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">warp 内 32 lanes：每个 lane 扫描 1/32 的元素</text>
    <g transform="translate(32 43)">
      <rect x="0" y="0" width="76" height="30" rx="8" fill="#ede9fe"/>
      <rect x="96" y="0" width="76" height="30" rx="8" fill="#ede9fe"/>
      <rect x="192" y="0" width="76" height="30" rx="8" fill="#ede9fe"/>
      <rect x="288" y="0" width="76" height="30" rx="8" fill="#ede9fe"/>
      <rect x="384" y="0" width="76" height="30" rx="8" fill="#ede9fe"/>
      <rect x="480" y="0" width="76" height="30" rx="8" fill="#ede9fe"/>
      <rect x="576" y="0" width="76" height="30" rx="8" fill="#ede9fe"/>
      <text x="38" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5b21b6">lane 0</text>
      <text x="134" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5b21b6">lane 1</text>
      <text x="230" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5b21b6">lane 2</text>
      <text x="326" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5b21b6">...</text>
      <text x="422" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5b21b6">lane 29</text>
      <text x="518" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5b21b6">lane 30</text>
      <text x="614" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5b21b6">lane 31</text>
      <text x="694" y="20" font-family="Arial, sans-serif" font-size="13" fill="#64748b">各自维护 k=16 min-heap</text>
    </g>
  </g>

  <line x1="470" y1="318" x2="470" y2="348" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(150 350)">
    <rect x="0" y="0" width="260" height="48" rx="12" fill="#dcfce7" stroke="#22c55e"/>
    <text x="130" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#166534">warp shuffle 合并 32 个局部 TopK</text>
  </g>
  <line x1="420" y1="374" x2="515" y2="374" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(530 350)">
    <rect x="0" y="0" width="260" height="48" rx="12" fill="#fee2e2" stroke="#ef4444"/>
    <text x="130" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#991b1b">输出 TopK block indices</text>
  </g>
</svg>
