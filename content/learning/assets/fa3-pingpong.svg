<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">FA3 warp specialization and pingpong scheduling</title>
  <desc id="desc">A producer warpgroup issues TMA loads while two consumer warpgroups alternate GEMM and softmax, so the exp unit and tensor core stay busy.</desc>
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L8 6 L2 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="360" rx="22" fill="#f8fafc"/>
  <text x="480" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#111827">warp specialization + pingpong 调度</text>
  <text x="480" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">时间从左向右；把数据搬移、GEMM、softmax 的 exp 错开，让 tensor core 一直忙</text>

  <!-- time axis -->
  <line x1="60" y1="300" x2="920" y2="300" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="60" y1="296" x2="60" y2="304" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="920" y1="296" x2="920" y2="304" stroke="#cbd5e1" stroke-width="2"/>
  <text x="490" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">time →</text>

  <!-- rows -->
  <g transform="translate(0 96)">
    <!-- Producer row -->
    <text x="10" y="18" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Producer</text>
    <rect x="90" y="0" width="110" height="34" rx="8" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/>
    <rect x="210" y="0" width="110" height="34" rx="8" fill="#e0e7ff" stroke="#818cf8" stroke-width="2"/>
    <rect x="330" y="0" width="110" height="34" rx="8" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
    <rect x="450" y="0" width="110" height="34" rx="8" fill="#e0e7ff" stroke="#818cf8" stroke-width="2"/>
    <rect x="570" y="0" width="110" height="34" rx="8" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/>
    <rect x="690" y="0" width="110" height="34" rx="8" fill="#e0e7ff" stroke="#818cf8" stroke-width="2"/>
    <text x="145" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#3730a3">TMA 加载 K/V</text>
    <text x="265" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#3730a3">stage 2</text>
    <text x="385" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">阶段轮换</text>
    <text x="505" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#3730a3">stage 3</text>
    <text x="625" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#3730a3">stage 4</text>
    <text x="745" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#3730a3">stage 5</text>
  </g>

  <!-- WG1 row -->
  <g transform="translate(0 156)">
    <text x="10" y="18" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">WG-1 消费</text>
    <rect x="90" y="0" width="100" height="34" rx="8" fill="#6ee7b7" stroke="#10b981" stroke-width="2"/>
    <rect x="226" y="0" width="86" height="34" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
    <rect x="348" y="0" width="100" height="34" rx="8" fill="#6ee7b7" stroke="#10b981" stroke-width="2"/>
    <rect x="484" y="0" width="86" height="34" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
    <rect x="606" y="0" width="100" height="34" rx="8" fill="#6ee7b7" stroke="#10b981" stroke-width="2"/>
    <text x="140" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#065f46">GEMM0 QK</text>
    <text x="269" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#92400e">softmax</text>
    <text x="398" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#065f46">GEMM1 PV</text>
    <text x="527" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#92400e">softmax</text>
    <text x="656" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#065f46">GEMM0</text>
  </g>

  <!-- WG2 row -->
  <g transform="translate(0 216)">
    <text x="10" y="18" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">WG-2 消费</text>
    <rect x="90" y="0" width="86" height="34" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
    <rect x="212" y="0" width="100" height="34" rx="8" fill="#6ee7b7" stroke="#10b981" stroke-width="2"/>
    <rect x="348" y="0" width="86" height="34" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
    <rect x="470" y="0" width="100" height="34" rx="8" fill="#6ee7b7" stroke="#10b981" stroke-width="2"/>
    <rect x="606" y="0" width="86" height="34" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
    <text x="133" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#92400e">softmax</text>
    <text x="262" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#065f46">GEMM</text>
    <text x="391" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#92400e">softmax</text>
    <text x="520" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#065f46">GEMM</text>
    <text x="649" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#92400e">softmax</text>
  </g>

  <!-- overlaps annotation -->
  <g transform="translate(0 322)">
    <text x="120" y="10" font-family="Arial, sans-serif" font-size="13" fill="#0f766e" font-weight="700">WG-1 的 softmax 与 WG-2 的 GEMM 重叠 → exp 单元和 tensor core 同时忙</text>
  </g>
</svg>
