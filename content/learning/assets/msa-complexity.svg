<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">MSA complexity comparison</title>
  <desc id="desc">Dense GQA grows quadratically with sequence length, while MSA main attention grows with a fixed selected budget.</desc>
  <defs>
    <linearGradient id="purple" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>
  <rect width="920" height="420" rx="22" fill="#f8fafc"/>
  <text x="460" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">计算量对比：完整 GQA 随 N² 增长，MSA 主分支预算固定</text>

  <g transform="translate(85 95)">
    <rect x="0" y="0" width="360" height="250" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="180" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">趋势示意</text>
    <line x1="58" y1="200" x2="315" y2="200" stroke="#94a3b8" stroke-width="2"/>
    <line x1="58" y1="200" x2="58" y2="55" stroke="#94a3b8" stroke-width="2"/>
    <path d="M60 198 C120 190, 160 165, 205 120 C250 75, 285 62, 312 58" fill="none" stroke="#7c3aed" stroke-width="4"/>
    <path d="M60 190 C125 182, 190 173, 312 157" fill="none" stroke="#10b981" stroke-width="4"/>
    <text x="316" y="58" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#7c3aed">GQA: N²</text>
    <text x="316" y="160" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">MSA main: N x kB_k</text>
    <text x="185" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">context length N</text>
    <text x="24" y="125" text-anchor="middle" transform="rotate(-90 24 125)" font-family="Arial, sans-serif" font-size="13" fill="#64748b">attention FLOPs</text>
  </g>

  <g transform="translate(505 95)">
    <rect x="0" y="0" width="330" height="250" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="165" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">论文主设置</text>
    <rect x="34" y="62" width="262" height="36" rx="8" fill="#ede9fe"/>
    <text x="165" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#5b21b6">B_k = 128, k = 16</text>
    <text x="44" y="132" font-family="Arial, sans-serif" font-size="15" fill="#334155">每个 query/group 最多读取：</text>
    <text x="44" y="166" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">16 x 128 = 2048 tokens</text>
    <text x="44" y="206" font-family="Arial, sans-serif" font-size="15" fill="#334155">当上下文是 1M tokens 时，主分支仍只精读约 2048 个 token。</text>
  </g>

  <g transform="translate(220 365)">
    <rect x="0" y="0" width="480" height="34" rx="17" fill="url(#purple)"/>
    <text x="240" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">论文报告：1M context 下 attention FLOPs 减少 28.4x</text>
  </g>
</svg>
