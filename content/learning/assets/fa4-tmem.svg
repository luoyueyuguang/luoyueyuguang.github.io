<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="title desc">
  <title id="title">FA4 warp groups and TMEM layout</title>
  <desc id="desc">Four warp groups (two softmax, one correction, one MMA/TMA) share a 256 KB tensor memory holding two S tiles and two O tiles, with P overlapping S.</desc>
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L8 6 L2 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="920" height="400" rx="22" fill="#f8fafc"/>
  <text x="460" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#111827">FA4：四个 warp 组 + TMEM 布局</text>
  <text x="460" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Blackwell 的累加器放在 tensor memory（每 SM 256 KB），128×128 tile</text>

  <!-- warp groups -->
  <g transform="translate(40 100)">
    <rect x="0" y="0" width="200" height="62" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="100" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#065f46">softmax wg 0（warp 0–3）</text>
    <text x="100" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0f766e">算 S 的软 max / exp / ℓ</text>

    <rect x="0" y="76" width="200" height="62" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="100" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#065f46">softmax wg 1（warp 4–7）</text>
    <text x="100" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0f766e">第二个 Q tile 的 softmax</text>

    <rect x="0" y="152" width="200" height="62" rx="12" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
    <text x="100" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#92400e">correction wg（warp 8–11）</text>
    <text x="100" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#b45309">读 acc_scale 重缩 O（关键路径外）</text>

    <rect x="0" y="228" width="200" height="62" rx="12" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/>
    <text x="100" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#3730a3">mma / TMA（warp 12–15）</text>
    <text x="100" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4f46e5">发 QK^T、P·V 的 MMA 和 TMA 加载</text>
  </g>

  <!-- TMEM layout -->
  <g transform="translate(300 100)">
    <rect x="0" y="0" width="580" height="290" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="290" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">TMEM（256 KB）</text>
    <text x="290" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">一个 128×128 fp32 累加器 tile = 64 KB</text>

    <rect x="20" y="66" width="120" height="70" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="80" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">S 0（stage 0）</text>
    <text x="80" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0f766e">列 0–128</text>

    <rect x="156" y="66" width="120" height="70" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="216" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">S 1 / P</text>
    <text x="216" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0f766e">列 128–256（与 P 重叠）</text>

    <rect x="292" y="66" width="120" height="70" rx="10" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/>
    <text x="352" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#3730a3">O 0</text>
    <text x="352" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4f46e5">列 256–384</text>

    <rect x="428" y="66" width="120" height="70" rx="10" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/>
    <text x="488" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#3730a3">O 1</text>
    <text x="488" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4f46e5">列 384–512</text>
  </g>

  <!-- pingpong note -->
  <g transform="translate(300 180)">
    <rect x="0" y="0" width="580" height="70" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="20" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">一次算两个 Q tile</text>
    <text x="20" y="52" font-family="Arial, sans-serif" font-size="12" fill="#64748b">一个 tile 的 tensor core 干活时，另一个 tile 在算 softmax；P 走 TMEM 传给 P·V MMA</text>
  </g>

  <g transform="translate(300 266)">
    <rect x="0" y="0" width="580" height="90" rx="12" fill="#ecfccb" stroke="#84cc16" stroke-width="2"/>
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#3f6212">寄存器是最紧张的资源</text>
    <text x="20" y="56" font-family="Arial, sans-serif" font-size="12" fill="#4d7c0f">一个线程 hold 整行 128 元素（BF16 输入 128 + 输出 64 reg）</text>
    <text x="20" y="76" font-family="Arial, sans-serif" font-size="12" fill="#4d7c0f">P 分四份存、边存边喂 MMA，降低峰值寄存器压力</text>
  </g>
</svg>
