<text x="668.3" y="302.0" font-family="Arial, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700" >compute-bound</text>
<text x="668.3" y="322.0" font-family="Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400" >算力封顶</text>
