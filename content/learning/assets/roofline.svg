<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img" aria-labelledby="ti de">
<title id="ti">A100 上的 Roofline：实测点与带宽上限之间的效率缺口</title>
<desc id="de">A100：BF16 稠密 312 TFLOPS、HBM 2.0 TB/s，ridge 156 FLOPs/byte。标准实现 I=1.65、达到 1.60 TFLOPS/s，占该点带宽上限的 48%；FlashAttention I=17.09、达到 10.30，占上限的 30%。两点都在 ridge 左侧且低于上限，这段垂直距离就是效率缺口。空心绿点是渐近上限 2M/d 约 3072，未实测。</desc>
<rect width="900" height="660" rx="22" fill="#f8fafc"/>
<text x="450.0" y="40.0" font-family="Arial, sans-serif" font-size="21" fill="#111827" text-anchor="middle" font-weight="700" >Roofline：实测点都在 ridge 左侧，而且离带宽上限还有距离</text>
<text x="450.0" y="66.0" font-family="Arial, sans-serif" font-size="13.5" fill="#64748b" text-anchor="middle" font-weight="400" >A100：BF16 稠密 312 TFLOPS，HBM 2.0 TB/s ⟹ ridge = 156 FLOPs/byte</text>
<rect x="110" y="110" width="680" height="360" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<g stroke="#eef2f7" stroke-width="1">
<line x1="157.6" y1="110" x2="157.6" y2="470"/>
<line x1="315.7" y1="110" x2="315.7" y2="470"/>
<line x1="473.8" y1="110" x2="473.8" y2="470"/>
<line x1="631.9" y1="110" x2="631.9" y2="470"/>
<line x1="790.0" y1="110" x2="790.0" y2="470"/>
<line x1="110" y1="470.0" x2="790" y2="470.0"/>
<line x1="110" y1="380.0" x2="790" y2="380.0"/>
<line x1="110" y1="290.0" x2="790" y2="290.0"/>
<line x1="110" y1="200.0" x2="790" y2="200.0"/>
<line x1="110" y1="110.0" x2="790" y2="110.0"/>
</g>
<polygon points="110.0,380.0 504.3,155.5 790,155.5 790,470 110,470" fill="#f1f5f9"/>
<line x1="110.0" y1="380.0" x2="504.3" y2="155.5" stroke="#2563eb" stroke-width="3"/>
<line x1="504.3" y1="155.5" x2="790" y2="155.5" stroke="#dc2626" stroke-width="3"/>
<line x1="504.3" y1="110" x2="504.3" y2="470" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="510.3" y="126.0" font-family="Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="700" >ridge = 156</text>
<text x="225.0" y="436.0" font-family="Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700" >memory-bound（带宽受限）</text>
<text x="662.0" y="436.0" font-family="Arial, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700" >compute-bound（算力受限）</text>
<line x1="192.1" y1="361.7" x2="192.1" y2="333.3" stroke="#b45309" stroke-width="2" stroke-dasharray="4 3"/>
<line x1="192.1" y1="361.7" x2="192.1" y2="470" stroke="#b45309" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.45"/>
<path d="M205.1 335.3 L205.1 359.7" stroke="#b45309" stroke-width="1.4"/>
<path d="M201.6 338.3 L205.1 333.8 L208.6 338.3" stroke="#b45309" stroke-width="1.4" fill="none"/>
<path d="M201.6 356.7 L205.1 361.2 L208.6 356.7" stroke="#b45309" stroke-width="1.4" fill="none"/>
<text x="211.1" y="351.5" font-family="Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="start" font-weight="700" >48%</text>
<circle cx="192.1" cy="361.7" r="7" fill="#b45309" stroke="#ffffff" stroke-width="2"/>
<text x="192.1" y="388.7" font-family="Arial, sans-serif" font-size="12.5" fill="#b45309" text-anchor="middle" font-weight="700" >标准实测</text>
<text x="192.1" y="404.7" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400" >I=1.65，1.60 TFLOPs/s</text>
<line x1="352.5" y1="288.8" x2="352.5" y2="242.0" stroke="#b45309" stroke-width="2" stroke-dasharray="4 3"/>
<line x1="352.5" y1="288.8" x2="352.5" y2="470" stroke="#b45309" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.45"/>
<path d="M365.5 244.0 L365.5 286.8" stroke="#b45309" stroke-width="1.4"/>
<path d="M362.0 247.0 L365.5 242.5 L369.0 247.0" stroke="#b45309" stroke-width="1.4" fill="none"/>
<path d="M362.0 283.8 L365.5 288.3 L369.0 283.8" stroke="#b45309" stroke-width="1.4" fill="none"/>
<text x="371.5" y="269.4" font-family="Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="start" font-weight="700" >30%</text>
<circle cx="352.5" cy="288.8" r="7" fill="#b45309" stroke="#ffffff" stroke-width="2"/>
<text x="352.5" y="315.8" font-family="Arial, sans-serif" font-size="12.5" fill="#b45309" text-anchor="middle" font-weight="700" >FA 实测</text>
<text x="352.5" y="331.8" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400" >I=17.09，10.30 TFLOPs/s</text>
<circle cx="709.0" cy="155.5" r="7" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
<text x="709.0" y="181.5" font-family="Arial, sans-serif" font-size="12.5" fill="#15803d" text-anchor="middle" font-weight="700" >2M/d ≈ 3072</text>
<text x="709.0" y="197.5" font-family="Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="400" >渐近上限（未实测）</text>
<line x1="201.1" y1="364.7" x2="340.5" y2="295.8" stroke="#b45309" stroke-width="1.8" marker-end="url(#a3)"/>
<text x="268.3" y="395.7" font-family="Arial, sans-serif" font-size="11.5" fill="#b45309" text-anchor="middle" font-weight="700" >流量降 9×</text>
<text x="157.6" y="488.0" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400" >1</text>
<text x="315.7" y="488.0" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400" >10</text>
<text x="473.8" y="488.0" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400" >100</text>
<text x="631.9" y="488.0" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400" >1000</text>
<text x="790.0" y="488.0" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400" >10000</text>
<text x="102.0" y="474.0" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="end" font-weight="400" >1e11</text>
<text x="102.0" y="384.0" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="end" font-weight="400" >1e12</text>
<text x="102.0" y="294.0" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="end" font-weight="400" >1e13</text>
<text x="102.0" y="204.0" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="end" font-weight="400" >1e14</text>
<text x="102.0" y="114.0" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="end" font-weight="400" >1e15</text>
<text x="450.0" y="514.0" font-family="Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="700" >算术强度 I（FLOPs/byte）</text>
<text x="34.0" y="290.0" font-family="Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="700" transform="rotate(-90 34 290.0)">达到的性能（FLOPs/s）</text>
<rect x="110" y="534" width="680" height="104" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<text x="126.0" y="556.0" font-family="Arial, sans-serif" font-size="12.5" fill="#111827" text-anchor="start" font-weight="700" >两点都在 ridge 左边，属于 memory-bound；同时都低于该点的带宽上限 β·I，那段垂直距离就是效率缺口。</text>
<text x="126.0" y="578.0" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400" >48% / 30% = 实际达到 ÷ 该点上限 β·I（本图配置：N=1024、d=64、forward+backward）。</text>
<text x="126.0" y="600.0" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400" >FA2 论文给的是另一个分母：FA1 只到理论峰值 FLOPs 的 25–40%，归因于 work partitioning</text>
<text x="126.0" y="618.0" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400" >（低占用率、多余的共享内存读写），FA2 把它提到 50–73%。空心绿点是渐近上限，不是实测。</text>
<defs><marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M2 2 L8 5 L2 8 Z" fill="#b45309"/></marker></defs>
</svg>
