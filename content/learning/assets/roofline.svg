<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="ti de">
<title id="ti">A100 上的 Roofline 与 attention 的算术强度</title>
<desc id="de">A100（BF16 稠密 312 TFLOPS，HBM 2.0 TB/s，ridge=156 FLOPs/byte）的 roofline。标准实现实测 I=1.65、FlashAttention 实测 I=17，都在 ridge 左侧（memory-bound）；2M/d 约 3072 是分块后的渐近上限，只有 N 足够大时才成立。</desc>
<rect width="900" height="640" rx="22" fill="#f8fafc"/>
<text x="450.0" y="40.0" font-family="Arial, sans-serif" font-size="21" fill="#111827" text-anchor="middle" font-weight="700" >Roofline：实测的 FA1 仍在 ridge 左边，渐近上限才越过它</text>
<text x="450.0" y="66.0" font-family="Arial, sans-serif" font-size="13.5" fill="#64748b" text-anchor="middle" font-weight="400" >A100：BF16 稠密 312 TFLOPS，HBM 2.0 TB/s ⟹ ridge = 156 FLOPs/byte</text>
<rect x="110" y="110" width="680" height="360" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
