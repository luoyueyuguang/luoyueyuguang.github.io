<line x1="110" y1="110.0" x2="790" y2="110.0"/>
</g>
<polygon points="110.0,326.0 504.3,146.4 790,146.4 790,470 110,470" fill="#f1f5f9"/>
<line x1="110.0" y1="326.0" x2="504.3" y2="146.4" stroke="#2563eb" stroke-width="3"/>
<line x1="504.3" y1="146.4" x2="790" y2="146.4" stroke="#dc2626" stroke-width="3"/>
