<circle cx="709.0" cy="146.4" r="7" fill="#15803d" stroke="#ffffff" stroke-width="2"/>
<line x1="202.0" y1="278.7" x2="339.1" y2="226.7" stroke="#b45309" stroke-width="2" marker-end="url(#ar2)"/>
<text x="268.1" y="270.0" font-family="Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700" >流量降 ~9×</text>
