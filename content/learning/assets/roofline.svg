<text x="450.0" y="512.0" font-family="Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="700" >算术强度 I（FLOPs/byte）</text>
<text x="34.0" y="290.0" font-family="Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="700" transform="rotate(-90 34 290.0)">可达性能上限（FLOPs/s）</text>
<rect x="110" y="532" width="680" height="86" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<text x="126.0" y="556.0" font-family="Arial, sans-serif" font-size="12.5" fill="#111827" text-anchor="start" font-weight="700" >实测口径（FA1 论文 Figure 2 左，GPT-2 medium，N=1024、d=64，forward+backward 端到端）</text>
<text x="126.0" y="578.0" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400" >标准实现 66.6 GFLOPs / 40.3 GB → I=1.65；FlashAttention 75.2 GFLOPs / 4.4 GB → I=17。两点都在 ridge 左边。</text>
<text x="126.0" y="600.0" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="400" >渐近口径 I=2M/d≈3072 是 N→∞ 的上限；N=1024 时 Θ(Nd) 项与分块重读项同量级，够不到。</text>
<defs><marker id="ar2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M2 2 L8 5 L2 8 Z" fill="#b45309"/></marker></defs>
</svg>
