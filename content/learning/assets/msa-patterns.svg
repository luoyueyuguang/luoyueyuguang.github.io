<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Learned sparse patterns in MSA</title>
  <desc id="desc">A heatmap-style diagram shows local diagonal, sink column, and long range stripes learned by the MSA indexer.</desc>
  <rect width="920" height="420" rx="22" fill="#f8fafc"/>
  <text x="460" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">MSA 学到的选择模式：附近、开头、远距离条带</text>
  <text x="460" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#64748b">论文可视化显示，不同 GQA group 会学到不同的 long-range sparse pattern</text>

  <g transform="translate(110 105)">
    <rect x="0" y="0" width="250" height="250" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="125" y="-16" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">选择概率热力图示意</text>
    <text x="125" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">横轴：Key block，纵轴：Query block</text>
    <g opacity="0.35" fill="#ede9fe">
      <rect x="0" y="0" width="250" height="250"/>
    </g>
    <g fill="#7c3aed">
      <rect x="0" y="0" width="18" height="250" opacity="0.65"/>
      <rect x="0" y="0" width="18" height="18"/>
      <rect x="22" y="22" width="18" height="18"/>
      <rect x="44" y="44" width="18" height="18"/>
      <rect x="66" y="66" width="18" height="18"/>
      <rect x="88" y="88" width="18" height="18"/>
      <rect x="110" y="110" width="18" height="18"/>
      <rect x="132" y="132" width="18" height="18"/>
      <rect x="154" y="154" width="18" height="18"/>
      <rect x="176" y="176" width="18" height="18"/>
      <rect x="198" y="198" width="18" height="18"/>
      <rect x="220" y="220" width="18" height="18"/>
    </g>
    <g fill="#10b981" opacity="0.8">
      <rect x="88" y="22" width="14" height="14"/>
      <rect x="110" y="44" width="14" height="14"/>
      <rect x="132" y="66" width="14" height="14"/>
      <rect x="154" y="88" width="14" height="14"/>
      <rect x="176" y="110" width="14" height="14"/>
      <rect x="198" y="132" width="14" height="14"/>
      <rect x="220" y="154" width="14" height="14"/>
      <rect x="44" y="132" width="14" height="14"/>
      <rect x="66" y="154" width="14" height="14"/>
      <rect x="88" y="176" width="14" height="14"/>
      <rect x="110" y="198" width="14" height="14"/>
    </g>
  </g>

  <g transform="translate(455 112)">
    <rect x="0" y="0" width="330" height="230" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="28" y="42" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#111827">三种常见结构</text>
    <rect x="30" y="65" width="24" height="24" fill="#7c3aed"/>
    <text x="68" y="83" font-family="Arial, sans-serif" font-size="15" fill="#334155">Local diagonal：当前位置附近很重要</text>
    <rect x="30" y="106" width="24" height="24" fill="#7c3aed" opacity="0.65"/>
    <text x="68" y="124" font-family="Arial, sans-serif" font-size="15" fill="#334155">Sink column：序列开头常被关注</text>
    <rect x="30" y="147" width="24" height="24" fill="#10b981"/>
    <text x="68" y="165" font-family="Arial, sans-serif" font-size="15" fill="#334155">Long-range stripes：远距离动态检索</text>
    <text x="30" y="205" font-family="Arial, sans-serif" font-size="14" fill="#64748b">不同 GQA group 会出现不同条带，说明选择不是一个全局固定模板。</text>
  </g>
</svg>
